databases:
  - name: rrimportaciones
    plan: free
    databaseName: rrimportaciones
    ipAllowList: []

services:
  - type: web
    name: rrimportaciones-api
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /swagger/index.html
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: JwtSettings__SecretKey
        generateValue: 256
      - key: JwtSettings__Issuer
        value: RRImportaciones
      - key: JwtSettings__Audience
        value: RRImportacionesApp
      - key: JwtSettings__ExpirationMinutes
        value: 1440
      - key: JwtSettings__RefreshTokenExpirationDays
        value: 7
      - key: PortalAccess__SecretKey
        generateValue: 128
      - key: PublicApp__BaseUrl
        value: https://rrimportaciones.onrender.com
      - key: EntregaLinks__BaseUrl
        value: https://rr-importaciones-app.vercel.app
      - key: EntregaLinks__ExpirationDays
        value: 30
      - key: Storage__Provider
        value: local
      # Notificaciones push nativas (Firebase Cloud Messaging).
      # El JSON de la cuenta de servicio va en base64 y se pega a mano en el
      # dashboard (sync: false): trae la llave privada del proyecto y no debe
      # quedar escrito en el repo. Si falta, el push cae solo al canal VAPID.
      - key: Firebase__ProjectId
        value: rrimportaciones-213d1
      - key: Firebase__ServiceAccountJsonBase64
        sync: false
      - key: Smtp__Host
        value: localhost
      - key: Smtp__Port
        value: "1025"
      - key: Smtp__UseSsl
        value: "false"
